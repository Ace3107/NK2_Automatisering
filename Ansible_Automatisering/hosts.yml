all:
  children:
    routers:
      hosts:
        R1:
          ansible_host: 10.10.99.1
          uplink_interface: GigabitEthernet0/0/1
          downlink_interface: GigabitEthernet0/0/0
          hsrp_ip: 10.10.10.2
          hsrp_priority: 110
        R2:
          ansible_host: 10.10.99.2
          # Kontroller: på tegning er oppkobling SW1 -> Gi0/1
          uplink_interface: GigabitEthernet0/1
          # Kontroller: fysisk nedlink til SW2
          downlink_interface: GigabitEthernet0/0
          hsrp_ip: 10.10.10.3
          hsrp_priority: 100
    switches:
      hosts:
        SW1:
          ansible_host: 10.10.99.10
        SW2:
          ansible_host: 10.10.99.11
        SW3:
          ansible_host: 10.10.99.12
  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: cisco.ios.ios
    ansible_user: admin
    ansible_become: true
    ansible_become_method: enable
