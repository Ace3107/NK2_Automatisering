# Pooler, subinterfaces og ruter hentes fra host_vars.
# Oppgavene legger til ønsket konfigurasjon; gammel konfigurasjon slettes ikke automatisk.
- name: Aktiver fysisk trunk mot nedre nett
  cisco.ios.ios_interfaces:
    config:
    - name: '{{ lower_parent }}'
      enabled: true
    state: merged
- name: Konfigurer gateway for klient VLAN
  cisco.ios.ios_config:
    parents: interface {{ lower_parent }}.{{ item.vlan }}
    lines:
    - encapsulation dot1Q {{ item.vlan }}
    - ip address {{ item.ip }} {{ item.mask }}
  loop: '{{ client_subinterfaces }}'
- name: Konfigurer statiske ruter
  cisco.ios.ios_config:
    lines:
    - ip route {{ item.network }} {{ item.mask }} {{ item.next_hop }}
  loop: '{{ static_routes }}'
- name: Kontroller om DHCP tjenesten er deaktivert
  cisco.ios.ios_command:
    commands:
    - show running-config | include ^no service dhcp
  register: dhcp_service
- name: Aktiver DHCP bare dersom tjenesten er deaktivert
  cisco.ios.ios_config:
    lines:
    - service dhcp
  when: '''no service dhcp'' in dhcp_service.stdout[0]'
- name: Reserver gateway og statiske adresser
  cisco.ios.ios_config:
    lines:
    - ip dhcp excluded-address {{ item.exclude_start }} {{ item.exclude_end }}
  loop: '{{ dhcp_pools }}'
- name: Konfigurer DHCP pool per klient VLAN
  cisco.ios.ios_config:
    parents: ip dhcp pool {{ item.name }}
    lines:
    - network {{ item.network }} {{ item.mask }}
    - default-router {{ item.gateway }}
    - dns-server {{ item.dns }}
  loop: '{{ dhcp_pools }}'
