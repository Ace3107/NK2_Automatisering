# Behold VLAN 199 på trunkene: Ansible bruker det til management.
# PortFast og BPDU Guard gjelder bare klientporter.
- name: Aktiver lokale trunkporter
  cisco.ios.ios_interfaces:
    config:
    - name: '{{ item }}'
      enabled: true
    state: merged
  loop: '{{ trunk_ports }}'
- name: Opprett klient og management VLAN
  cisco.ios.ios_config:
    parents: vlan {{ item.id }}
    lines:
    - name {{ item.name }}
  loop: '{{ vlans }}'
  when: management.vlan == 199
- name: Konfigurer lokale trunkporter
  cisco.ios.ios_config:
    parents: interface {{ item }}
    lines:
    - switchport mode trunk
    - switchport trunk allowed vlan {{ allowed_vlans }}
  loop: '{{ trunk_ports }}'
- name: Konfigurer klientporter
  cisco.ios.ios_config:
    parents: interface {{ item.interface }}
    lines:
    - switchport mode access
    - switchport access vlan {{ item.vlan }}
    - spanning-tree portfast
    - spanning-tree bpduguard enable
  loop: '{{ access_ports }}'
- name: Aktiver klientporter
  cisco.ios.ios_interfaces:
    config:
    - name: '{{ item.interface }}'
      enabled: true
    state: merged
  loop: '{{ access_ports }}'
