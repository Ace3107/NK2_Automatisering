- name: Kontroller nettverket uten å endre konfigurasjon
  hosts: ios
  gather_facts: false
  tasks:
  - name: Hent felles status
    cisco.ios.ios_command:
      commands:
      - show ip interface brief
      - show ip ssh
    register: common
  - name: Kontroller SSH versjon 2
    ansible.builtin.assert:
      that:
      - '''version 2.0'' in common.stdout[1]'
      fail_msg: SSH versjon 2 ble ikke bekreftet.
  - name: Hent switchstatus
    cisco.ios.ios_command:
      commands:
      - show vlan brief
      - show interfaces trunk
      - show etherchannel summary
    when: device_type == 'switch'
    register: sw
  - name: Hent ruterstatus
    cisco.ios.ios_command:
      commands:
      - show ip route
      - show ip dhcp pool
      - show ip dhcp binding
    when: device_type == 'router'
    register: rt
  - name: Test oppgitte naboer med ping
    cisco.ios.ios_command:
      commands:
      - ping {{ item }}
      wait_for:
      - result[0] contains 'Success rate is 100 percent'
      retries: 3
      interval: 2
    loop: '{{ test_targets }}'
  - name: Opprett mappe for status
    ansible.builtin.file:
      path: '{{ playbook_dir }}/../results'
      state: directory
      mode: '0700'
    delegate_to: localhost
    become: false
    run_once: true
  - name: Skriv status lokalt
    ansible.builtin.copy:
      dest: '{{ playbook_dir }}/../results/{{ inventory_hostname }}.txt'
      mode: '0600'
      content: '{{ common.stdout | join(''\n\n'') }}

        {{ sw.stdout | default([]) | join(''\n\n'') }}

        {{ rt.stdout | default([]) | join(''\n\n'') }}

        '
    delegate_to: localhost
    become: false
