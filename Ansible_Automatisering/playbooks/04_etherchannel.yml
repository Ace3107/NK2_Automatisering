- name: Avtalt EtherChannel til nabostudent
  hosts: SW-ACCESS
  gather_facts: false
  tasks:
  - name: Krev eksplisitt aktivering
    ansible.builtin.assert:
      that:
      - shared_etherchannel_enabled | bool
      fail_msg: Avtal porter, LACP og VLAN med STUD2. Aktiver deretter shared_etherchannel_enabled.
  - name: Aktiver medlemsporter
    cisco.ios.ios_interfaces:
      config:
      - name: '{{ item }}'
        enabled: true
      state: merged
    loop: '{{ etherchannel.ports }}'
  - name: Konfigurer fysiske medlemmer
    cisco.ios.ios_config:
      parents: interface {{ item }}
      lines:
      - switchport mode trunk
      - switchport trunk allowed vlan {{ allowed_vlans }}
      - channel-group {{ etherchannel.id }} mode active
    loop: '{{ etherchannel.ports }}'
  - name: Konfigurer logisk port channel
    cisco.ios.ios_config:
      parents: interface Port-channel{{ etherchannel.id }}
      lines:
      - switchport mode trunk
      - switchport trunk allowed vlan {{ allowed_vlans }}
  - name: Aktiver Port channel
    cisco.ios.ios_interfaces:
      config:
      - name: Port-channel{{ etherchannel.id }}
        enabled: true
      state: merged
  - name: Lagre
    cisco.ios.ios_config:
      save_when: modified
