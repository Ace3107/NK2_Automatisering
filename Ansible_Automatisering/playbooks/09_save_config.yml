---
- name: Lagre konfigurering på valgte IOS-enheter
  hosts: all
  gather_facts: false
  tasks:
    - name: Krev godkjenning
      ansible.builtin.assert:
        that: allow_changes | bool
        fail_msg: 'Bruk -e allow_changes=true for å lagre.'
    - name: Lagre running-config til startup-config
      cisco.ios.ios_config:
        save_when: always
