# Felles IOS-tilkobling. Passord oppgis med -k/-K og lagres ikke her.
# Aktiver felles EtherChannel først etter avtale med STUD2.
ansible_connection: ansible.netcommon.network_cli
ansible_network_os: cisco.ios.ios
ansible_become: true
ansible_become_method: enable
ansible_network_cli_ssh_type: libssh
vlans:
- id: 10
  name: STUD1_CLIENTS
- id: 20
  name: STUD2_CLIENTS
- id: 199
  name: LOWER_MGMT
allowed_vlans: 10,20,199
shared_etherchannel_enabled: false
