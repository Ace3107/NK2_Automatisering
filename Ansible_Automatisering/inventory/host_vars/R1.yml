# Tilpass faktiske portnavn før konsollscriptet kjøres.
# management brukes av bootstrap; klientnett/DHCP brukes av Ansible.
device_type: router
hostname: R1
domain: nk2.lab
console_baud: 9600
management:
  interface: GigabitEthernet0/0/1
  ip: 10.10.99.1
  mask: 255.255.255.0
lower_parent: GigabitEthernet0/0/0
lower_mgmt:
  vlan: 199
  ip: 10.10.199.1
  mask: 255.255.255.0
client_subinterfaces:
- vlan: 10
  ip: 192.168.10.1
  mask: 255.255.255.0
static_routes:
- network: 192.168.20.0
  mask: 255.255.255.0
  next_hop: 10.10.99.2
dhcp_pools:
- name: VLAN10
  network: 192.168.10.0
  mask: 255.255.255.0
  gateway: 192.168.10.1
  exclude_start: 192.168.10.1
  exclude_end: 192.168.10.49
  dns: 1.1.1.1
- name: MGMT99
  network: 10.10.99.0
  mask: 255.255.255.0
  gateway: 10.10.99.1
  exclude_start: 10.10.99.1
  exclude_end: 10.10.99.49
  dns: 1.1.1.1
- name: MGMT199
  network: 10.10.199.0
  mask: 255.255.255.0
  gateway: 10.10.199.1
  exclude_start: 10.10.199.1
  exclude_end: 10.10.199.49
  dns: 1.1.1.1
test_targets:
- 10.10.99.2
- 10.10.199.11
- 10.10.199.12
- 192.168.20.1
