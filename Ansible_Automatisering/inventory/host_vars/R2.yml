# Tilpass faktiske portnavn før konsollscriptet kjøres.
# management brukes av bootstrap; klientnett/DHCP brukes av Ansible.
device_type: router
hostname: R2
domain: nk2.lab
console_baud: 9600
management:
  interface: GigabitEthernet0/0/1
  ip: 10.10.99.2
  mask: 255.255.255.0
lower_parent: GigabitEthernet0/0/0
lower_mgmt:
  vlan: 199
  ip: 10.10.199.2
  mask: 255.255.255.0
client_subinterfaces:
- vlan: 20
  ip: 192.168.20.1
  mask: 255.255.255.0
static_routes:
- network: 192.168.10.0
  mask: 255.255.255.0
  next_hop: 10.10.99.1
dhcp_pools:
- name: VLAN20
  network: 192.168.20.0
  mask: 255.255.255.0
  gateway: 192.168.20.1
  exclude_start: 192.168.20.1
  exclude_end: 192.168.20.49
  dns: 1.1.1.1
test_targets:
- 10.10.99.1
- 10.10.199.11
- 10.10.199.12
- 192.168.10.1
