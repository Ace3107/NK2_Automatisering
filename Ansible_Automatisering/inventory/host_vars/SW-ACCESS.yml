# Tilpass faktiske portnavn før konsollscriptet kjøres.
# management brukes av bootstrap; klientnett/DHCP brukes av Ansible.
device_type: switch
hostname: SW-ACCESS
domain: nk2.lab
console_baud: 9600
management:
  vlan: 199
  ip: 10.10.199.12
  mask: 255.255.255.0
  gateway: 10.10.199.1
bootstrap_access_ports: []
trunk_ports:
- FastEthernet0/3
access_ports:
- interface: FastEthernet0/1
  vlan: 10
- interface: FastEthernet0/2
  vlan: 20
routed_switch: false
etherchannel:
  id: 1
  ports:
  - FastEthernet0/4
  - FastEthernet0/5
test_targets:
- 10.10.199.1
- 10.10.199.11
